<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>ApkaStore - Neighborhood Store & Udhar Khata</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="ApkaStore connects you directly with neighborhood grocery & daily needs stores with instant delivery, Parchi lists, and Udhar Khata ledger." />
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ApkaStore" />
    <meta name="application-name" content="ApkaStore" />
    
    <!-- PWA Icons & Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <style id="expo-reset">
      html, body { height: 100%; margin: 0; padding: 0; background-color: #F8FAFC; }
      body { overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            console.log('[PWA] Service Worker registered with scope:', reg.scope);
          }).catch(function(err) {
            console.log('[PWA] Service Worker registration failed:', err);
          });
        });
      }
    </script>
  </head>

  <body>
    <noscript>
      <div style="padding: 20px; text-align: center; font-family: sans-serif;">
        <h2>JavaScript Required</h2>
        <p>You need to enable JavaScript to run ApkaStore.</p>
      </div>
    </noscript>
    <div id="root"></div>
  </body>
</html>
